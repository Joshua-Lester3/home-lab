---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf
  namespace: media
  labels:
    app: audiobookshelf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audiobookshelf
  template:
    metadata:
      labels:
        app: audiobookshelf
    spec:
      containers:
        - name: audiobookshelf
          image: ghcr.io/advplyr/audiobookshelf:latest
          env:
            - name: TZ
              value: "America/New_York"
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          volumeMounts:
            - name: storage
              mountPath: /config
              subPath: config/audiobookshelf
            - name: storage
              mountPath: /audiobooks
              subPath: media/audiobooks
            - name: storage
              mountPath: /podcasts
              subPath: media/podcasts
            - name: storage
              mountPath: /metadata
              subPath: config/audiobookshelf/metadata
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: media-storage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: audiobookshelf
  namespace: media
spec:
  type: NodePort
  selector:
    app: audiobookshelf
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30013
      protocol: TCP
